<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>


        <!-- =========================================
         HEADER / BANNER
    ========================================== -->

    <section class="contact-banner">

        <div class="banner-content">

            <h1>Create Account</h1>

            <div class="breadcrumb">
                <a href="#">Home</a>
                <span>/</span>
                <span>Create Account</span>
            </div>

        </div>

    </section>
    
       <div class="wrap">
    <div class="visual">
      <img src="/assets/images/login-img.jpg" alt="Model wearing a white fedora hat and pearl jewelry">
    </div>
    <div class="panel">
      <div class="form-box">
        <h1>Create Account</h1>
        <p class="sub">Join Us for a Beautiful Jewelry Journey</p>

        <div class="field">
          <label for="username">Your Name</label>
          <input type="text" id="username" placeholder="Enter your name">
        </div>

        <div class="field">
          <label for="password">Username</label>
          <input type="password" id="password" placeholder="Enter your username">
        </div>

       <div class="field">
          <label for="password">Your email address *</label>
          <input type="password" id="password" placeholder="Enter your name or address">
        </div>

        <div class="field">
          <label for="password">Password *</label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="btn-login">Sign up</button>

        <p class="divider-text">Or continue with</p>
        <div class="socials">
          <button class="social-btn" aria-label="Continue with Facebook">
            <svg viewBox="0 0 24 24" fill="#1c1a19"><path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.6c0-.9.25-1.5 1.55-1.5h1.66V3.2C15.98 3.1 15.03 3 13.9 3c-2.24 0-3.78 1.37-3.78 3.87v2.9H7.4v3.2h2.72v8h3.38z"/></svg>
          </button>
          <button class="social-btn" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.32-.17-1.95H12v3.7h5.4a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.9-1.75 2.97-4.33 2.97-7.27z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.44l-3.23-2.5c-.9.6-2.05.96-3.4.96-2.6 0-4.8-1.76-5.6-4.12H3.06v2.58A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.52H3.06a10 10 0 0 0 0 8.96l3.34-2.58z"/><path fill="#EA4335" d="M12 6.18c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.94 5.52l3.34 2.58c.8-2.36 3-4.12 5.6-4.12z"/></svg>
          </button>
          <button class="social-btn" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24" fill="#1c1a19"><path d="M16.36 12.4c-.02-1.9 1.55-2.82 1.62-2.86-.88-1.29-2.26-1.47-2.75-1.49-1.17-.12-2.29.69-2.88.69-.6 0-1.5-.67-2.47-.65-1.27.02-2.44.74-3.1 1.88-1.32 2.3-.34 5.7.95 7.56.63.9 1.38 1.92 2.37 1.88.95-.04 1.31-.62 2.46-.62s1.48.62 2.48.6c1.03-.02 1.68-.93 2.3-1.84.73-1.05 1.03-2.07 1.05-2.12-.02-.01-2-.77-2.03-3.03zM14.4 6.5c.53-.63.88-1.5.79-2.37-.76.03-1.68.51-2.23 1.13-.49.55-.92 1.44-.8 2.28.85.07 1.71-.42 2.24-1.04z"/></svg>
          </button>
        </div>

        <hr class="sep">

        <p class="footer-line">Don't have an account? <a href="#">Create an account</a></p>
        <p class="protected">Your data is protected &amp; encrypted</p>
      </div>
    </div>
  </div>

  <div class="scroll-top" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </div>




</body>
</html>
